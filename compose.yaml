services:
  tesla-charger-service:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets
