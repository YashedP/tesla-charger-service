services:
  tesla-charger-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: "80"
    expose:
      - "80"
    volumes:
      - tesla_charger_service_data:/app/data
      - tesla_charger_service_secrets:/app/secrets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  tesla_charger_service_data:
    name: tesla_charger_service_data
  tesla_charger_service_secrets:
    name: tesla_charger_service_secrets
